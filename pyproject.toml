[project]
name = "chess-commentary"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JayDungrani", email = "jaydungrani11@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "chess>=1.11.2",
    "fastapi[standard]>=0.141.1",
    "google>=3.0.0",
    "google-genai>=2.24.0",
    "groq>=1.7.0",
    "pandas>=3.0.5",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.3",
    "tabulate>=0.10.0",
    "tiktoken>=0.14.0",
    "websockets<17.0",
]

[project.scripts]
chess-commentary = "chess_commentary:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
